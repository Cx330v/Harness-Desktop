name: Bug 报告
description: 报告可复现的 Harness Desktop 问题
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        请勿提交 API Key、私有会话、完整日志或个人敏感路径。
  - type: input
    id: desktop_version
    attributes:
      label: Harness Desktop 版本
      placeholder: 例如 0.1.34
    validations:
      required: true
  - type: input
    id: harness_version
    attributes:
      label: Harness Runtime 版本
      placeholder: 例如 0.1.0-rc.6
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请从启动应用开始按顺序描述。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏日志
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Windows 版本
      options: [Windows 10, Windows 11, 其他]
    validations:
      required: true

